<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Background Icon shape -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Outer subtle glow/border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8" />

  <!-- Calendar Card -->
  <g filter="url(#shadow)">
    <rect x="96" y="112" width="320" height="300" rx="28" fill="url(#cardGrad)" />
    <!-- Header banner -->
    <path d="M 96,140 A 28,28 0 0,1 124,112 L 388,112 A 28,28 0 0,1 416,140 L 416,192 L 96,192 Z" fill="#2563eb" />
    <!-- Binder rings -->
    <rect x="160" y="88" width="24" height="48" rx="12" fill="#1e293b" />
    <rect x="328" y="88" width="24" height="48" rx="12" fill="#1e293b" />
    
    <!-- Title text or dots -->
    <text x="256" y="164" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="2">6x2</text>

    <!-- Grid items representing shifts -->
    <!-- Row 1 -->
    <rect x="128" y="216" width="48" height="44" rx="10" fill="#dbeafe" />
    <text x="152" y="244" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#1e40af" text-anchor="middle">M</text>
    
    <rect x="192" y="216" width="48" height="44" rx="10" fill="#dbeafe" />
    <text x="216" y="244" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#1e40af" text-anchor="middle">M</text>
    
    <rect x="256" y="216" width="48" height="44" rx="10" fill="#ffedd5" />
    <text x="280" y="244" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#c2410c" text-anchor="middle">T</text>
    
    <rect x="320" y="216" width="48" height="44" rx="10" fill="#ffedd5" />
    <text x="344" y="244" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#c2410c" text-anchor="middle">T</text>

    <!-- Row 2 -->
    <rect x="128" y="276" width="48" height="44" rx="10" fill="#f3e8ff" />
    <text x="152" y="304" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#6b21a8" text-anchor="middle">N</text>
    
    <rect x="192" y="276" width="48" height="44" rx="10" fill="#f3e8ff" />
    <text x="216" y="304" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#6b21a8" text-anchor="middle">N</text>
    
    <rect x="256" y="276" width="48" height="44" rx="10" fill="#dcfce7" />
    <text x="280" y="304" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#15803d" text-anchor="middle">F</text>
    
    <rect x="320" y="276" width="48" height="44" rx="10" fill="#dcfce7" />
    <text x="344" y="304" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#15803d" text-anchor="middle">F</text>

    <!-- Bottom Badge -->
    <rect x="128" y="336" width="240" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" />
    <text x="248" y="364" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#1d4ed8" text-anchor="middle">TURMAS A • B • C • D</text>
  </g>
</svg>
